name: Robot multas SIMIT

on:
  schedule:
    # Cada 6 horas (hora UTC). Cada corrida consulta pendientes del mes
    # hasta ~5h20 y la siguiente continúa. Cuando no hay pendientes, termina en 1-2 min.
    - cron: "17 */6 * * *"
  workflow_dispatch:   # botón "Run workflow" para correrlo a mano

concurrency:
  group: robot-multas
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para mantener activo el horario (GitHub lo apaga tras 60 días sin actividad)

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -q -r robot/requirements.txt

      - name: Consultar SIMIT y actualizar el Google Sheet
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LIMITE_MINUTOS: "320"
        run: python robot/robot_multas.py

      - name: Mantener activo el horario
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/robot-multas.yml/enable" || true
